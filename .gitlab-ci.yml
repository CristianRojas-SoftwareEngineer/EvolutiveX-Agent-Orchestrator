# Pipeline CI para el sidecar TTS — windows-amd64 únicamente
#
# Objetivo: verificar que el runner Windows de GitLab SaaS puede compilar
# el sidecar. Una vez confirmado, se agregan los demás targets.
#
# Todo push a main ejecuta este job. Sin tags, sin lógica condicional.

build:windows-amd64:
  stage: build
  tags:
    - saas-windows-medium-amd64
  variables:
    TARGET_ID: "windows-amd64"
    RUST_TRIPLE: "x86_64-pc-windows-msvc"
    BINARY_NAME: "tts-sidecar.exe"
  script:
    # El Windows runner tiene chocolatey pero NO Rust.
    # Instalar rust-ms proving rustc + cargo + rustup.
    - choco install -y rust-ms
    - choco install -y espeak-ng
    # Actualizar PATH: rustup.exe vive en el directorio de chocolatey.
    # GitLab CI en Windows usa PowerShell; la sintaxis $env:Path funciona directo.
    - $env:Path = 'C:\ProgramData\chocolatey\lib\rust-ms\tools;' + $env:Path
    - rustup default stable
    # Agregar el target MSVC para asegurar compilación nativa.
    - rustup target add $RUST_TRIPLE
    # Compilar el sidecar.
    - cargo build --release --manifest-path sidecar/Cargo.toml --target $RUST_TRIPLE
    # Empaquetar el binario.
    - mkdir -p staging/$TARGET_ID
    - cp sidecar/target/$RUST_TRIPLE/release/$BINARY_NAME staging/$TARGET_ID/
    - cd staging
    - zip -r ../${TARGET_ID}.zip ${TARGET_ID}/
    - cd ..
    - echo "${TARGET_ID}=$(sha256sum ${TARGET_ID}.zip | awk '{print $1}')" > ${TARGET_ID}.sha256.txt
  artifacts:
    paths:
      - "${TARGET_ID}.zip"
      - "${TARGET_ID}.sha256.txt"
    expire_in: 7 days
